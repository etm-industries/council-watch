{% extends "base.html" %}
{% block title %}Search | {{ site_title }}{% endblock %}
{% block description %}Search Austin City Council meeting records, agenda items, and votes.{% endblock %}

{% block content %}
<h1>Search</h1>
<input type="text" id="search-box" placeholder="Search meetings, agenda items, council members..." autofocus>
<div id="search-results" style="margin-top: 1.5rem;"></div>

<script>
  const INDEX_URL = "{{ base_url }}/search-index.json";
  let index = [];

  async function loadIndex() {
    const resp = await fetch(INDEX_URL);
    index = await resp.json();
  }

  function search(query) {
    if (!query || query.length < 2) return [];
    const q = query.toLowerCase();
    return index
      .filter(item => item.title.toLowerCase().includes(q))
      .slice(0, 30);
  }

  function render(results, query) {
    const container = document.getElementById("search-results");
    // Clear existing results using safe DOM manipulation (no innerHTML)
    while (container.firstChild) container.removeChild(container.firstChild);

    if (!query || query.length < 2) return;

    if (!results.length) {
      const p = document.createElement("p");
      p.textContent = "No results found.";
      container.appendChild(p);
      return;
    }

    for (const r of results) {
      const div = document.createElement("div");
      div.className = "result";

      const a = document.createElement("a");
      a.href = r.url;
      a.textContent = r.title;

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.style.marginLeft = "0.5rem";
      meta.textContent = `${r.type} \u00b7 ${r.date}`;

      div.appendChild(a);
      div.appendChild(meta);
      container.appendChild(div);
    }
  }

  loadIndex().catch(() => {});

  const box = document.getElementById("search-box");
  box.addEventListener("input", () => {
    render(search(box.value), box.value);
  });
</script>
{% endblock %}
