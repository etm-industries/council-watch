<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Council Watch Austin</title>
  <meta name="description" content="Search Austin City Council meeting records, agenda items, and votes.">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      color: #1a1a1a;
      line-height: 1.6;
    }
    header {
      border-bottom: 3px solid #1a1a1a;
      padding-bottom: 0.75rem;
      margin-bottom: 2rem;
    }
    header h1 a {
      text-decoration: none;
      color: inherit;
      font-size: 1.5rem;
      font-weight: bold;
    }
    nav { margin-top: 0.5rem; font-family: Arial, sans-serif; font-size: 0.9rem; }
    nav a { margin-right: 1.5rem; color: #1a1a1a; text-decoration: none; border-bottom: 1px solid #999; }
    nav a:hover { border-bottom-color: #1a1a1a; }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.4rem; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; }
    h3 { font-size: 1.1rem; }
    .meta { color: #666; font-family: Arial, sans-serif; font-size: 0.85rem; }
    .badge {
      display: inline-block;
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 3px;
      background: #eee;
      color: #333;
    }
    .badge-aye { background: #d4edda; color: #155724; }
    .badge-nay { background: #f8d7da; color: #721c24; }
    .badge-absent { background: #fff3cd; color: #856404; }
    table { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 0.9rem; }
    th { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 2px solid #1a1a1a; }
    td { padding: 0.35rem 0.5rem; border-bottom: 1px solid #eee; }
    tr:hover td { background: #f9f9f9; }
    .meeting-card {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .meeting-card h3 { margin: 0 0 0.25rem; }
    .meeting-card .meta { margin-bottom: 0.5rem; }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #ddd;
      font-family: Arial, sans-serif;
      font-size: 0.8rem;
      color: #666;
    }
    a { color: #0066cc; }
    a:hover { color: #004499; }
    .stats-row { display: flex; gap: 2rem; margin: 1.5rem 0; }
    .stat { text-align: center; }
    .stat .number { font-size: 2rem; font-weight: bold; display: block; }
    .stat .label { font-size: 0.85rem; color: #666; font-family: Arial, sans-serif; }
    #search-box { width: 100%; padding: 0.6rem; font-size: 1rem; border: 2px solid #1a1a1a; border-radius: 3px; }
    #search-results .result { padding: 0.75rem 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Council Watch Austin</a></h1>
    <nav>
      <a href="/">Home</a>
      <a href="/members/">Council Members</a>
      <a href="/search/">Search</a>
      <a href="/about/">About</a>
    </nav>
  </header>
  <main>
    
<h1>Search</h1>
<input type="text" id="search-box" placeholder="Search meetings, agenda items, council members..." autofocus>
<div id="search-results" style="margin-top: 1.5rem;"></div>

<script>
  const INDEX_URL = "/search-index.json";
  let index = [];

  async function loadIndex() {
    const resp = await fetch(INDEX_URL);
    index = await resp.json();
  }

  function search(query) {
    if (!query || query.length < 2) return [];
    const q = query.toLowerCase();
    return index
      .filter(item => item.title.toLowerCase().includes(q))
      .slice(0, 30);
  }

  function render(results, query) {
    const container = document.getElementById("search-results");
    // Clear existing results using safe DOM manipulation (no innerHTML)
    while (container.firstChild) container.removeChild(container.firstChild);

    if (!query || query.length < 2) return;

    if (!results.length) {
      const p = document.createElement("p");
      p.textContent = "No results found.";
      container.appendChild(p);
      return;
    }

    for (const r of results) {
      const div = document.createElement("div");
      div.className = "result";

      const a = document.createElement("a");
      a.href = r.url;
      a.textContent = r.title;

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.style.marginLeft = "0.5rem";
      meta.textContent = `${r.type} \u00b7 ${r.date}`;

      div.appendChild(a);
      div.appendChild(meta);
      container.appendChild(div);
    }
  }

  loadIndex().catch(() => {});

  const box = document.getElementById("search-box");
  box.addEventListener("input", () => {
    render(search(box.value), box.value);
  });
</script>

  </main>
  <footer>
    Data from <a href="https://austintexas.legistar.com">Austin Legistar</a> and
    <a href="https://data.austintexas.gov">Austin Open Data Portal</a>.
    Updated daily. Public domain.
  </footer>
</body>
</html>
