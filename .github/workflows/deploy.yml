name: Ingest and Deploy

on:
  schedule:
    # 6 AM CT = 11 AM UTC (standard time) or 12 PM UTC (daylight time)
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of history to fetch"
        default: "90"
        required: false

permissions:
  contents: write

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231  # v5.3.1
        with:
          version: "0.5.21"

      - name: Install dependencies
        run: uv sync

      - name: Run ingestion
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          # Use env var to avoid injection from workflow_dispatch input
          DAYS_BACK: ${{ github.event.inputs.days_back || '90' }}
        run: |
          uv run python scripts/ingest.py --days-back "$DAYS_BACK" \
            ${SOCRATA_APP_TOKEN:+--app-token "$SOCRATA_APP_TOKEN"}

      - name: Generate static site
        run: uv run python scripts/generate.py --output-dir site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d231e97723741e312  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "Deploy: ${{ github.run_id }}"
